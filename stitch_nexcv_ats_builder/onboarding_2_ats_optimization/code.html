<style>
      .glass-panel {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .gradient-primary {
        background: linear-gradient(135deg, #004ac6 0%, #4b41e1 100%);
      }
      .shimmer {
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
        background-size: 200% 100%;
      }
    </style>

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">
<!-- Top Navigation Bar (Suppressed for Onboarding context, but Branding is kept as requested for Identity) -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface/80 backdrop-blur-md px-container-margin h-16 flex items-center justify-between">
<div class="font-headline-md-mobile text-headline-md-mobile font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">NextCV</div>
<button class="text-on-surface-variant font-label-md px-4 py-2 hover:bg-surface-container-high/50 rounded-full transition-colors">
            Skip
        </button>
</header>
<main class="flex-grow flex flex-col pt-16 px-container-margin pb-10">
<!-- Illustration Section (ATS Scanning Visualization) -->
<section class="flex-grow flex items-center justify-center py-stack-lg">
<div class="relative w-full max-w-sm aspect-square flex items-center justify-center">
<!-- Decorative Glow -->
<div class="absolute inset-0 bg-primary/5 rounded-full blur-3xl"></div>
<!-- Central Visual Device -->
<div class="relative w-full h-full flex items-center justify-center">
<!-- Resume Card Shell -->
<div class="w-48 h-64 bg-white rounded-xl shadow-lg border border-outline-variant/20 p-4 relative overflow-hidden flex flex-col gap-2">
<div class="h-4 w-1/2 bg-surface-container-high rounded-full"></div>
<div class="h-2 w-3/4 bg-surface-container rounded-full"></div>
<div class="h-2 w-full bg-surface-container rounded-full"></div>
<div class="h-2 w-full bg-surface-container rounded-full"></div>
<div class="mt-4 h-2 w-2/3 bg-surface-container rounded-full"></div>
<div class="h-2 w-full bg-surface-container rounded-full"></div>
<!-- Scanning Beam Effect -->
<div class="absolute top-1/2 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary to-transparent opacity-50 shadow-[0_0_15px_rgba(0,74,198,0.5)]"></div>
<div class="absolute top-1/2 left-0 w-full h-32 bg-gradient-to-b from-primary/10 to-transparent"></div>
</div>
<!-- Floating Score Badge -->
<div class="absolute -right-2 top-10 glass-panel shadow-xl rounded-2xl p-4 border border-white flex flex-col items-center">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-green-500 text-lg" style="font-variation-settings: &quot;FILL&quot; 1;">check_circle</span>
<span class="font-headline-md text-primary font-bold">98/100</span>
</div>
<span class="text-[10px] font-label-md text-on-surface-variant uppercase tracking-wider">ATS Score</span>
</div>
<!-- Floating Keyword Chips -->
<div class="absolute -left-4 bottom-16 glass-panel shadow-lg rounded-full px-3 py-1.5 border border-white flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm">auto_awesome</span>
<span class="text-xs font-label-md text-on-surface">Cloud Architecture</span>
</div>
<div class="absolute left-10 -bottom-2 glass-panel shadow-lg rounded-full px-3 py-1.5 border border-white flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm">memory</span>
<span class="text-xs font-label-md text-on-surface">Data Analysis</span>
</div>
<!-- Main Imagery Prompt for Background/Styling Reference -->

</div>
</div>
</section>

<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface">
                Optimize resumes for ATS systems
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed">
                Ensure your resume passes through applicant tracking systems with our smart scanning technology.
            </p>
</section>
<!-- Navigation Section -->
<section class="mt-auto pt-stack-lg flex flex-col items-center gap-stack-lg">
<!-- Pagination Dots -->
<div class="flex gap-2">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-6 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
<!-- Primary Action -->
<button class="w-full gradient-primary text-on-primary py-4 rounded-xl font-headline-md shadow-lg active:scale-95 transition-transform duration-200">
                Next
            </button>
</section>
