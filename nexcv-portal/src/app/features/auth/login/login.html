<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <form [formGroup]="form" (ngSubmit)="submit()" class="w-full max-w-sm bg-white p-8 rounded-xl shadow">
    <h1 class="text-xl font-semibold mb-6">NextCV Admin</h1>

    <label class="block text-sm font-medium mb-1">Email</label>
    <input type="email" formControlName="email" class="w-full border rounded px-3 py-2 mb-4" />

    <label class="block text-sm font-medium mb-1">Password</label>
    <input type="password" formControlName="password" class="w-full border rounded px-3 py-2 mb-4" />

    @if (error()) {
      <p class="text-red-600 text-sm mb-4">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="form.invalid || loading()"
      class="w-full bg-blue-600 text-white rounded py-2 disabled:opacity-50"
    >
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
