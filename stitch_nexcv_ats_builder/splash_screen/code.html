<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>ResumeNova Splash</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface": "#faf8ff",
                      "surface-dim": "#d2d9f4",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary": "#ffffff",
                      "secondary-container": "#645efb",
                      "on-tertiary-container": "#bdffdb",
                      "primary-fixed-dim": "#b4c5ff",
                      "surface-container": "#eaedff",
                      "inverse-primary": "#b4c5ff",
                      "on-primary": "#ffffff",
                      "inverse-surface": "#283044",
                      "tertiary": "#006242",
                      "secondary": "#4b41e1",
                      "on-primary-fixed-variant": "#003ea8",
                      "background": "#faf8ff",
                      "on-tertiary-fixed": "#002113",
                      "on-surface-variant": "#434655",
                      "surface-tint": "#0053db",
                      "on-primary-container": "#eeefff",
                      "tertiary-fixed": "#6ffbbe",
                      "on-tertiary": "#ffffff",
                      "on-surface": "#131b2e",
                      "surface-container-low": "#f2f3ff",
                      "primary": "#004ac6",
                      "surface-bright": "#faf8ff",
                      "outline": "#737686",
                      "on-error-container": "#93000a",
                      "on-secondary-fixed": "#000000",
                      "outline-variant": "#c3c6d7",
                      "surface-container-highest": "#dae2fd",
                      "on-error": "#ffffff",
                      "on-secondary-container": "#fffbff",
                      "tertiary-fixed-dim": "#4edea3",
                      "on-background": "#131b2e",
                      "on-tertiary-fixed-variant": "#005236",
                      "surface-container-high": "#e2e7ff",
                      "error": "#ba1a1a",
                      "surface-variant": "#dae2fd",
                      "inverse-on-surface": "#eef0ff",
                      "primary-container": "#2563eb",
                      "tertiary-container": "#007d55",
                      "error-container": "#ffdad6",
                      "on-primary-fixed": "#00174b",
                      "primary-fixed": "#dbe1ff",
                      "secondary-fixed": "#e2dfff",
                      "on-secondary-fixed-variant": "#3323cc",
                      "secondary-fixed-dim": "#c3c0ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "16px",
                      "stack-md": "16px",
                      "container-margin": "20px",
                      "unit": "4px",
                      "stack-lg": "24px",
                      "stack-sm": "8px"
              },
              "fontFamily": {
                      "headline-xl": ["Plus Jakarta Sans"],
                      "label-md": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-lg": ["Plus Jakarta Sans"],
                      "body-lg": ["Inter"],
                      "headline-md": ["Plus Jakarta Sans"],
                      "headline-xl-mobile": ["Plus Jakarta Sans"]
              },
              "fontSize": {
                      "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                      "body-md": ["14px", {"lineHeight": "22px", "fontWeight": "400"}],
                      "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "body-lg": ["16px", {"lineHeight": "26px", "fontWeight": "400"}],
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "headline-xl-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}]
              }
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .splash-gradient {
            background: radial-gradient(circle at top left, #eeefff 0%, #ffffff 40%, #ffffff 60%, #e2dfff 100%);
        }
        .loader-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #2563eb;
            opacity: 0.3;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest font-body-md text-on-surface">
<!-- Splash Screen Wrapper -->
<main class="relative min-h-screen w-full flex flex-col items-center justify-center splash-gradient overflow-hidden">
<!-- Abstract Decorative Elements -->
<div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-80 h-80 bg-secondary/5 rounded-full blur-3xl"></div>
<!-- Center Identity Section -->
<div class="flex flex-col items-center z-10">
<!-- AI Premium Logo Icon -->
<div class="relative mb-stack-lg">
<div class="w-24 h-24 rounded-[2rem] bg-gradient-to-tr from-primary to-secondary flex items-center justify-center shadow-2xl shadow-primary/20 rotate-12">
<div class="bg-surface-container-lowest w-[92%] h-[92%] rounded-[1.8rem] flex items-center justify-center rotate-[-12deg]">
<span class="material-symbols-outlined text-transparent bg-clip-text bg-gradient-to-br from-primary to-secondary text-[48px]" data-icon="auto_awesome" style="font-variation-settings: &quot;FILL&quot; 1;">
                            auto_awesome
                        </span>
</div>
</div>
<!-- Sparkle Accent -->
<div class="absolute -top-2 -right-2 bg-tertiary-fixed-dim p-1.5 rounded-full shadow-lg">
<span class="material-symbols-outlined text-on-tertiary-fixed-variant text-[16px]" data-icon="bolt" style="font-variation-settings: &quot;FILL&quot; 1;">
                        bolt
                    </span>
</div>
</div>
<!-- Brand Name -->
<h1 class="font-headline-xl-mobile text-headline-xl-mobile font-extrabold tracking-tight mb-stack-sm"><span class="bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">NexCV</span></h1>
<!-- Tagline -->
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] text-center leading-relaxed">
                Build <span class="text-primary font-semibold">ATS-Friendly</span> Resumes with AI
            </p>
</div>
<!-- Bottom Loading Indicator -->
<div class="absolute bottom-16 flex flex-col items-center gap-stack-md">
<div class="flex gap-2">
<!-- Static representation of loading dots as requested (UI only) -->
<div class="loader-dot !opacity-100"></div>
<div class="loader-dot !opacity-60"></div>
<div class="loader-dot"></div>
</div>
<span class="font-label-md text-label-md text-outline tracking-widest uppercase">Initializing Intelligence</span>
</div>
<!-- Subtle Background Pattern for Premium Feel -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#004ac6 0.5px, transparent 0.5px); background-size: 24px 24px;">
</div>
</main>
<!-- Success Visual/Contextual Detail (Optional subtle toast or hint) -->
<div class="fixed bottom-8 px-container-margin w-full max-w-md left-1/2 -translate-x-1/2">
<div class="bg-white/40 backdrop-blur-md border border-white/60 p-4 rounded-xl flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="verified_user">verified_user</span>
</div>
<div>
<p class="font-label-md text-on-surface text-[11px]">OPTIMIZED FOR</p>
<p class="font-headline-md text-[13px] font-bold">Standard Recruitment Systems</p>
</div>
</div>
</div>


</body></html>
